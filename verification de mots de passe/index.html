<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>verifier un mot de passe </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <form action="">
            <label>Utilisateur</label>
            <input type="text">
            <label >Mot de passe</label>
            <input type="password" id="psw" required>
            <input type="submit" value="envoyer">
        </form>
    </div>

    <div id="message">
        <h3>le message doit contenir les elements suivants</h3>
        <p id="letter" class="invalid">Une lettre minuscule</p>
        <p id="capital" class="invalid">Une lettre majuscule</p>
        <p id="number" class="invalid">Une chiffre</p>
        <p id="lenght" class="invalid">8 caracteres minimum</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
